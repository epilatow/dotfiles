# ============================================================================
# Schedules use systemd OnCalendar syntax; intervals use systemd time-span
# syntax. See:
#   https://www.freedesktop.org/software/systemd/man/systemd.time.html
# ============================================================================

# ----------------------------------------------------------------------------
# defaults section
# ----------------------------------------------------------------------------
# Tool-wide settings cascaded to every job. Per-job and per-target
# settings can override anything here.

[defaults]
notify-channels      = ["ntfy"]
notify-attach-log    = true
notify-attach-max-kb = 256
keep-awake           = true
# timeout-sec          = 3600         # default: 1800 sec (30 min)
# log-keep-runs        = 30

# A job that sets its own env.PATH replaces this value rather than
# extending it.
[defaults.env]
PATH = "$PATH:$HOME/.local/bin:/opt/homebrew/bin"

[defaults.notify.ntfy]
transport              = "ntfy"
url                    = "https://ntfy.drymartini.org/automation-crony"
token-file             = "~/.config/crony/secrets/ntfy-token"
headers                = { "Email" = "edp@drymartini.org" }

# ----------------------------------------------------------------------------
# job sections
# ----------------------------------------------------------------------------
# A schedulable unit of work. Either `command` (one-line shell) or
# `script` (path under the dotfiles repo) is required. A job with
# no schedule/interval is valid only if some [job-group.*] references
# it (otherwise it can never fire).

[job.codex-remote-control]
# Keep app-server in the foreground so Crony owns its lifecycle.  The stable
# default socket is what local `codex --remote unix://` clients attach to.
command     = "codex app-server --remote-control --listen unix://"
gate        = "command -v codex"
daemon      = true
uuid        = "4c392a33-485b-4a2a-abd6-4d029d151769"

[job.u-bins-brew]
command     = "brew update && NONINTERACTIVE=1 brew upgrade"
gate        = "command -v brew"
platforms   = ["darwin"]
uuid = "681b903c-2a7b-460d-a940-10e267f8585f"

[job.u-bins-npm]
command     = "fnm exec --using default -- npm update -g"
gate        = "command -v fnm"
uuid        = "5da77278-c34d-4167-ab27-b53af33d2a48"

[job.cleanup-codex-cli]
script      = "~/.local/libexec/cleanup-codex-cli/cleanup-codex-cli"
args        = ["--apply"]
gate        = 'test -d "${CODEX_HOME:-$HOME/.codex}/packages/standalone/releases"'
uuid        = "bd1ea33c-c8cb-40bb-925b-a2fbdc2bba9e"

[job.u-www-gas-prices]
script    = "~/.local/libexec/gas-prices-breakdown/gas-prices-breakdown"
args      = ["add-snapshot", "~/home/public_html/gas-prices-breakdown.html"]
hosts     = ["squee"]
uuid = "7f5100fa-4af2-437f-8321-82aadc0a0ac1"

[job.u-www-cocktails]
script    = "$HOME/home/bin/publish_cocktails.sh"
env.PATH  = "/opt/local/bin:$HOME/common/bin:$PATH:$HOME/.local/bin:/opt/homebrew/bin"
hosts     = ["squee"]
uuid = "c43196ed-2fe5-44b7-9585-42d943960aba"

[job.u-www-recipes]
script    = "$HOME/home/bin/publish_recipes.sh"
env.PATH  = "$PATH:$HOME/.local/bin:/opt/homebrew/bin:/opt/local/bin"
hosts     = ["squee"]
uuid = "7a3d515e-85cd-4d4b-9fa4-e0d208905547"

[job.u-www-dpmr-cal]
script    = "~/.local/libexec/dpmr-calendar-scrape/dpmr-calendar-scrape"
args      = ["~/home/public_html/donner-party-mountain-runners.ics"]
hosts     = ["squee"]
uuid = "d54ced11-0886-4e33-ac3d-d77974a0a75f"

[job.u-www-push]
script    = "$HOME/home/bin/publish_html.sh"
hosts     = ["squee"]
uuid = "7695800b-6737-4df5-ab20-07af2cf978d2"

[job.u-rs-self]
command     = 'eval "$(fnm env --shell bash)" && cd $REPO && ./bin/repo-shared upgrade-tools --push'
gate        = "test -d $REPO"
env.REPO    = "$HOME/src/github.com/epilatow/repo-shared"
hosts       = ["squee"]
uuid = "5e24fcff-bb5b-45ea-8152-1557c5467163"

[job.u-rs-dotfiles]
command     = 'eval "$(fnm env --shell bash)" && cd $REPO && ./_repo_shared/repo-shared upgrade --push'
gate        = "test -d $REPO"
env.REPO    = "$HOME/src/github.com/epilatow/dotfiles"
hosts       = ["squee"]
uuid = "56f916de-daa1-4455-aa66-e6cbe5c3399f"

[job.u-rs-ha-bt]
command     = 'eval "$(fnm env --shell bash)" && cd $REPO && ./_repo_shared/repo-shared upgrade --push'
gate        = "test -d $REPO"
env.REPO    = "$HOME/src/github.com/epilatow/ha-blueprint-toolkit"
hosts       = ["squee"]
uuid = "9654e112-442f-4ae5-b977-51cf84cd2853"

[job.u-rs-utils]
command     = 'eval "$(fnm env --shell bash)" && cd $REPO && ./_repo_shared/repo-shared upgrade --push'
gate        = "test -d $REPO"
env.REPO    = "$HOME/src/github.com/epilatow/utils"
hosts       = ["squee"]
uuid = "70f668b3-e0d5-41d7-b40c-307756703a65"

[job.u-misc-tz]
command   = "darwin-tz-watchdog"
platforms = ["darwin"]
uuid = "ca506c3d-0026-4705-a09a-16ecf7881f6c"

# ----------------------------------------------------------------------------
# job-group sections
# ----------------------------------------------------------------------------
# A scheduled sequencer that fires named jobs in order. Has its own
# schedule but no command/script of its own.

[job-group.u-bins]
jobs = ["u-bins-brew", "u-bins-npm"]
uuid = "ee2e73e4-f89d-4ebf-af65-6631b32b2365"

[job-group.weekly]
schedule = "Mon *-*-* 02:00"
jobs     = ["u-bins"]
uuid     = "8c5893d7-bea0-421f-9f95-d36b30775fe2"

[job-group.u-rs]
jobs = ["u-rs-self", "u-rs-dotfiles", "u-rs-ha-bt", "u-rs-utils"]
uuid = "aab9b864-897a-4a96-b2c5-cea58d927e1d"

[job-group.u-www]
jobs     = ["u-www-cocktails", "u-www-recipes", "u-www-dpmr-cal", "u-www-gas-prices", "u-www-push"]
hosts    = ["squee"]
uuid = "4977a66e-4c17-40f4-8e67-03012dce9894"

[job-group.u-misc]
jobs     = ["u-misc-tz"]
uuid = "82d72cf7-de37-4de3-aaee-eb1ea63b3c56"

[job-group.daily]
schedule = "*-*-* 02:30"
jobs     = ["u-rs", "u-www", "u-misc", "cleanup-codex-cli"]
uuid = "94593230-26d3-45f5-993b-fc4b352111df"

# ----------------------------------------------------------------------------
# target sections
# ----------------------------------------------------------------------------
# Selects which jobs and groups install on which hosts. A host
# target replaces the platform target when both apply; the explicit
# `jobs` list IS the selection (no inherits / exclude / add).

[target.host.truenas-brittan]
jobs            = ["weekly", "daily"]

[target.host.truenas-polaris]
jobs            = ["weekly", "daily"]

[target.host.squee]
jobs            = ["weekly", "daily", "codex-remote-control"]
