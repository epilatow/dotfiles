[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "epilatow-repo-shared",
    "pytest>=9.0.3",
]

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "4ea1a7be751b1cb60ab1e7e91070857e1c8191e9" }

[tool.pytest.ini_options]
testpaths = ["_repo_shared/tests", "tests"]

[tool.repo-shared.code-quality]
python-targets = [
    "files/local/libexec/tmux-agent-session-namer/tmux-agent-session-namer",
]
