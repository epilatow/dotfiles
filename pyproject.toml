[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "epilatow-repo-shared",
    "pytest>=9.0.3",
]

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "3a184278e3f3d63d03f427d2ceda786e177c6755" }

[tool.pytest.ini_options]
testpaths = ["_repo_shared/tests"]
