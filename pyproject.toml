[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "epilatow-repo-shared",
    "pytest>=9.0.3",
    # A libexec script reached through its `src/*.py` symlink is imported
    # into this environment by its tests, so the environment has to carry
    # what the script imports at module scope. Each script itself resolves
    # these from its own PEP 723 block when run.
    "openpyxl",
    "xlrd",
    "curl_cffi",
    "beautifulsoup4",
    "icalendar>=7.0",
]

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "defef34e785bd486f9fca22a007e114c89165338" }

[tool.mypy]
# `tests/test_gas_prices_breakdown.py` imports its subject through the
# `src/*.py` symlink, reaching it by extending sys.path at runtime. mypy
# does not execute that, so the same directory has to be on its search
# path for the import to resolve when the gate type-checks the test.
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["_repo_shared/tests", "tests"]

[tool.repo-shared.code-quality]
# The libexec entries are shebang scripts with no `.py` extension, which
# the gate's `rglob("*.py")` discovery cannot see. Two ways to reach one:
# a `src/<module>.py` symlink to it, which additionally gives the script
# a module name, or an explicit path here.
python-targets = [
    "files/local/libexec/tmux-agent-session-namer/tmux-agent-session-namer",
]
