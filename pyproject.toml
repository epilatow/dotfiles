[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "epilatow-repo-shared",
    "pytest>=9.0.3",
    # A libexec script reached through its `src/*.py` symlink is imported
    # into this environment by its tests, so the environment has to carry
    # what the script imports at module scope. Each script itself resolves
    # these from its own PEP 723 block when run.
    "openpyxl",
    "pdfplumber",
    "xlrd",
    "pydantic>=2",
    "curl_cffi",
    "beautifulsoup4",
    "icalendar>=7.0",
]

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "ebc7b9cb8bf770a0cef33e5dd4ce84e9c43a0b69" }

[tool.mypy]
python_version = "3.15"
# The gas-price tests import their subjects through the
# `src/*.py` symlink, reaching it by extending sys.path at runtime. mypy
# does not execute that, so the same directory has to be on its search
# path for the imports to resolve when the gate type-checks the tests.
# The libexec directory also carries their shared research model.
mypy_path = ["src", "files/local/libexec/gas-prices-breakdown"]

[tool.ruff]
target-version = "py315"

[tool.pytest.ini_options]
testpaths = ["_repo_shared/tests", "tests"]

[tool.repo-shared.markdown]
# No markdown exclusions are currently needed.

[tool.ruff.lint.isort]
known-first-party = [
    "gas_prices_breakdown",
    "gas_prices_agent",
    "gas_prices_collectors",
    "gas_prices_research",
]

[tool.repo-shared.code-quality]
# The libexec entries are shebang scripts with no `.py` extension, which
# the gate's `rglob("*.py")` discovery cannot see. Two ways to reach one:
# a `src/<module>.py` symlink to it, which additionally gives the script
# a module name, or an explicit path here.
python-targets = [
    "files/local/libexec/tmux-agent-session-namer/tmux-agent-session-namer",
]
