[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "epilatow-repo-shared",
    "pytest>=9.0.3",
    "websockets>=16,<17",
]

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "7479009c79854700cfad35e12b7e988d00e302e6" }

[tool.pytest.ini_options]
testpaths = ["_repo_shared/tests", "tests"]

[tool.mypy]
mypy_path = ["files/local/libexec/codex-archive-inactive"]

[tool.repo-shared.code-quality]
python-targets = [
    "files/local/libexec/tmux-agent-session-namer/tmux-agent-session-namer",
]
