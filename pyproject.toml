[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "epilatow-repo-shared",
    "pytest>=9.0.3",
]

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "6109c09f3034a53676a53ec4c5f507dd4059cfe0" }

[tool.pytest.ini_options]
testpaths = ["_repo_shared/tests"]
