[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "epilatow-repo-shared",
    "pytest>=9.0.3",
]

[tool.uv.sources]
epilatow-repo-shared = { git = "https://github.com/epilatow/repo-shared", rev = "c8023c951c25c4797e7d98c7cd8f340cbb1fda89" }

[tool.pytest.ini_options]
testpaths = ["_repo_shared/tests", "tests"]

[tool.repo-shared.code-quality]
python-targets = [
    "files/local/libexec/tmux-agent-session-namer/tmux-agent-session-namer",
]
